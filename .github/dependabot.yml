version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - ci
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore

  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - backend
    groups:
      go-modules:
        patterns:
          - "*"
    commit-message:
      prefix: chore

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - frontend
    groups:
      frontend-packages:
        patterns:
          - "*"
    commit-message:
      prefix: chore
