name: nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "17 20 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - name: tag
        id: tag
        run: |
          short_sha="$(git rev-parse --short=12 HEAD)"
          date_utc="$(date -u +%Y%m%d)"
          cli_version="$(ruby -ne 'if $_ =~ /url ".*\/v([^"]+)\.tar\.gz"/ then puts $1; exit end' Formula/linea.rb)"
          if [ -z "$cli_version" ]; then
            cli_version="0.1.0"
          fi
          tag="nightly-${date_utc}-${short_sha}"
          printf "value=%s\n" "$tag" >> "$GITHUB_OUTPUT"
          printf "title=nightly %s\n" "$date_utc" >> "$GITHUB_OUTPUT"
          printf "cli=%s\n" "$cli_version" >> "$GITHUB_OUTPUT"

      - name: build
        env:
          VERSION: ${{ steps.tag.outputs.value }}
          APP_VERSION: ${{ steps.tag.outputs.cli }}
          BUILD_VERSION: ${{ github.run_number }}
        run: |
          tag="${{ steps.tag.outputs.value }}"
          make macos-package
          mkdir -p dist/package
          cd backend
          GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w -X main.version=${tag}" -o ../dist/package/linea ./cmd/server
          cd ..
          tar -C dist/package -czf "dist/linea_${tag}_darwin_arm64.tar.gz" linea
          cd backend
          GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w -X main.version=${tag}" -o ../dist/package/linea ./cmd/server
          cd ..
          tar -C dist/package -czf "dist/linea_${tag}_darwin_amd64.tar.gz" linea
          shasum -a 256 dist/*.tar.gz dist/macos/Linea.dmg > dist/checksums.txt

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.LINEA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.LINEA_BOT_PRIVATE_KEY }}

      - name: Build iOS app
        run: |
          cd ios
          xcodebuild -project Linea.xcodeproj -scheme Linea -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO -quiet
          cd ..
          mkdir -p dist/ios
          cp -r "$(find ~/Library/Developer/Xcode/DerivedData -name 'Linea.app' -path '*/Release-iphoneos/*' | head -1)" dist/ios/
          cd dist/ios
          zip -r "Linea-${TAG}.zip" Linea.app
          cd ../..

      - name: publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.tag.outputs.value }}
          TITLE: ${{ steps.tag.outputs.title }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/macos/Linea.dmg dist/ios/Linea-*.zip dist/checksums.txt \
            --title "$TITLE" \
            --prerelease \
            --notes "Nightly build from \`${GITHUB_SHA}\`."
