name: release install check

on:
  push:
    branches:
      - main
    paths:
      - Formula/linea.rb
      - Makefile
      - .github/workflows/release-install-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: check
        run: make install-check
