name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  darwin-arm64:
    runs-on: macos-15
    environment: npm

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - name: Build package
        run: |
          make macos-package
          mkdir -p dist/package
          cd backend
          GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o ../dist/package/linea ./cmd/server
          cd ..
          tar -C dist/package -czf "dist/linea_${GITHUB_REF_NAME}_darwin_arm64.tar.gz" linea
          cd backend
          GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o ../dist/package/linea ./cmd/server
          cd ..
          tar -C dist/package -czf "dist/linea_${GITHUB_REF_NAME}_darwin_amd64.tar.gz" linea
          shasum -a 256 dist/*.tar.gz dist/macos/Linea.dmg > dist/checksums.txt

      - name: Build bottle
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/bottle/linea/"$version"/bin
          cd backend
          GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w -X main.version=${version}" -o ../dist/bottle/linea/"$version"/bin/linea ./cmd/server
          cd ..
          tar -C dist/bottle -czf "dist/linea-${version}.arm64_sequoia.bottle.tar.gz" linea

      - name: Build iOS app
        continue-on-error: true
        id: ios-build
        run: |
          cd ios
          xcodebuild -project Linea.xcodeproj -scheme Linea -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO -quiet || exit 1
          cd ..
          mkdir -p dist/ios
          app_path="$(find ~/Library/Developer/Xcode/DerivedData -name 'Linea.app' -path '*/Release-iphoneos/*' | head -1)"
          if [ -z "$app_path" ]; then
            echo "iOS app not found, skipping"
            exit 1
          fi
          cp -r "$app_path" dist/ios/
          cd dist/ios
          zip -r "Linea-${GITHUB_REF_NAME}.zip" Linea.app
          cd ../..
          echo "ios_zip=dist/ios/Linea-${GITHUB_REF_NAME}.zip" >> "$GITHUB_OUTPUT"

      - name: Update package version
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm version "$version" --no-git-tag-version --allow-same-version

      - name: Update Homebrew formula
        run: |
          version="${GITHUB_REF_NAME#v}"
          curl -sL "https://github.com/bniladridas/linea/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz" \
            -o /tmp/source.tar.gz
          source_sha=$(shasum -a 256 /tmp/source.tar.gz | awk '{print $1}')
          bottle_sha=$(shasum -a 256 "dist/linea-${version}.arm64_sequoia.bottle.tar.gz" | awk '{print $1}')
          sed -i '' "s|url \".*\"|url \"https://github.com/bniladridas/linea/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz\"|" Formula/linea.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"${source_sha}\"/" Formula/linea.rb
          sed -i '' "s|root_url \".*\"|root_url \"https://github.com/bniladridas/linea/releases/download/${GITHUB_REF_NAME}\"|" Formula/linea.rb
          sed -i '' "s/sha256 arm64_sequoia: \".*\"/sha256 arm64_sequoia: \"${bottle_sha}\"/" Formula/linea.rb

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.LINEA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.LINEA_BOT_PRIVATE_KEY }}

      - name: Create version update PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          version="${GITHUB_REF_NAME}"
          branch="release/${version}"
          git config user.name "linea-route[bot]"
          git config user.email "289668827+linea-route[bot]@users.noreply.github.com"
          git add Formula/linea.rb package.json
          test -f package-lock.json && git add package-lock.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git checkout -b "$branch"
          git commit -m "chore: update formula and package for ${version}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/bniladridas/linea.git" "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: update formula and package for ${version}" \
            --body "${version}" \
            --label "formula" \
            || echo "PR may already exist"

      - name: Publish release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          ios_asset="${{ steps.ios-build.outputs.ios_zip }}"
          if [ -n "$ios_asset" ] && [ -f "$ios_asset" ]; then
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/macos/Linea.dmg "$ios_asset" dist/checksums.txt --title "$GITHUB_REF_NAME" --generate-notes || echo "release already exists"
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/macos/Linea.dmg dist/checksums.txt --title "$GITHUB_REF_NAME" --generate-notes || echo "release already exists"
          fi

      - name: Publish to npm
        run: |
          npm install -g npm@latest >/dev/null 2>&1
          version="${GITHUB_REF_NAME#v}"
          npm publish --access public --provenance 2>&1 || echo "already published"

  android:
    needs: darwin-arm64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - name: Android SDK
        run: |
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          if [ ! -d "$ANDROID_SDK_ROOT" ]; then
            ANDROID_SDK_ROOT="$HOME/android/sdk"
            mkdir -p "$ANDROID_SDK_ROOT"
          fi
          export ANDROID_SDK_ROOT
          if ! command -v sdkmanager &>/dev/null && [ -f "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          fi
          if ! command -v sdkmanager &>/dev/null; then
            CMDLINE_TOOLS_VERSION="11076708"
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            cd /tmp
            curl -sSLo cmdline-tools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip"
            unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            rm -f cmdline-tools.zip
            export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          fi
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" >/dev/null
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          ./gradlew assembleDebug
          cd ..
          mkdir -p dist/android
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/android/Linea-${GITHUB_REF_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: dist/android/Linea-*.apk

      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/android/Linea-*.apk
