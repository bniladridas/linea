name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  darwin-arm64:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - name: Build package
        run: |
          make macos-package
          mkdir -p dist/package
          cd backend
          GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o ../dist/package/linea ./cmd/server
          cd ..
          tar -C dist/package -czf "dist/linea_${GITHUB_REF_NAME}_darwin_arm64.tar.gz" linea
          shasum -a 256 dist/*.tar.gz dist/macos/Linea.dmg > dist/checksums.txt

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.LINEA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.LINEA_BOT_PRIVATE_KEY }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/macos/Linea.dmg dist/checksums.txt --title "$GITHUB_REF_NAME" --generate-notes
