name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  darwin-arm64:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - name: Build package
        run: |
          make macos-package
          mkdir -p dist/package
          cd backend
          GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o ../dist/package/linea ./cmd/server
          cd ..
          tar -C dist/package -czf "dist/linea_${GITHUB_REF_NAME}_darwin_arm64.tar.gz" linea
          cd backend
          GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o ../dist/package/linea ./cmd/server
          cd ..
          tar -C dist/package -czf "dist/linea_${GITHUB_REF_NAME}_darwin_amd64.tar.gz" linea
          shasum -a 256 dist/*.tar.gz dist/macos/Linea.dmg > dist/checksums.txt

      - name: Build bottle
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/bottle/linea/"$version"/bin
          cd backend
          GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w -X main.version=${version}" -o ../dist/bottle/linea/"$version"/bin/linea ./cmd/server
          cd ..
          tar -C dist/bottle -czf "dist/linea-${version}.arm64_sequoia.bottle.tar.gz" linea

      - name: Build iOS app
        run: |
          cd ios
          xcodebuild -project Linea.xcodeproj -scheme Linea -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO -quiet
          cd ..
          mkdir -p dist/ios
          cp -r "$(find ~/Library/Developer/Xcode/DerivedData -name 'Linea.app' -path '*/Release-iphoneos/*' | head -1)" dist/ios/
          cd dist/ios
          zip -r "Linea-${GITHUB_REF_NAME}.zip" Linea.app
          cd ../..

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.LINEA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.LINEA_BOT_PRIVATE_KEY }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/macos/Linea.dmg dist/ios/Linea-*.zip dist/checksums.txt --title "$GITHUB_REF_NAME" --generate-notes

  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - name: Android SDK
        run: |
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          if [ ! -d "$ANDROID_SDK_ROOT" ]; then
            ANDROID_SDK_ROOT="$HOME/android/sdk"
            mkdir -p "$ANDROID_SDK_ROOT"
          fi
          export ANDROID_SDK_ROOT
          if ! command -v sdkmanager &>/dev/null && [ -f "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          fi
          if ! command -v sdkmanager &>/dev/null; then
            CMDLINE_TOOLS_VERSION="11076708"
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            cd /tmp
            curl -sSLo cmdline-tools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip"
            unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            rm -f cmdline-tools.zip
            export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          fi
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" >/dev/null
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          ./gradlew assembleDebug
          cd ..
          mkdir -p dist/android
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/android/Linea-${GITHUB_REF_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: dist/android/Linea-*.apk

      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/android/Linea-*.apk
