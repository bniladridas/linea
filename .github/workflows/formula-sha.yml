name: formula sha

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.LINEA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.LINEA_BOT_PRIVATE_KEY }}

      - name: Resolve tag
        id: tag
        run: |
          tag="${{ github.event.release.tag_name }}"
          if [ -z "$tag" ]; then
            tag="${{ inputs.tag }}"
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Apply sha
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          version="${tag#v}"

          url="https://github.com/bniladridas/linea/archive/refs/tags/${tag}.tar.gz"
          curl -fsSL "$url" -o source.tar.gz
          sha="$(sha256sum source.tar.gz | awk '{print $1}')"
          TAG="$tag" SHA="$sha" ruby -0pi -e 'gsub(/url "https:\/\/github\.com\/bniladridas\/linea\/archive\/refs\/tags\/v[^"]+\.tar\.gz"/, "url \"https://github.com/bniladridas/linea/archive/refs/tags/#{ENV.fetch("TAG")}.tar.gz\""); gsub(/sha256 "[0-9a-f]{64}"/, "sha256 \"#{ENV.fetch("SHA")}\"")' Formula/linea.rb
          rm source.tar.gz

          bottle_url="https://github.com/bniladridas/linea/releases/download/${tag}/linea-${version}.arm64_sequoia.bottle.tar.gz"
          if curl -fsSL "$bottle_url" -o bottle.tar.gz; then
            bottle_sha="$(sha256sum bottle.tar.gz | awk '{print $1}')"
            BOTTLE_SHA="$bottle_sha" ruby -0pi -e '
              gsub(/sha256 arm64_sequoia: "[0-9a-f]{64}"/, "sha256 arm64_sequoia: \"#{ENV.fetch("BOTTLE_SHA")}\"")
            ' Formula/linea.rb
            rm bottle.tar.gz
          fi

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: main
          branch: formula-sha-${{ steps.tag.outputs.tag }}
          delete-branch: true
          title: "chore: formula sha"
          commit-message: "chore: formula sha"
          body: ""
